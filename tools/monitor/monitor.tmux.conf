# Scoped to the monitor's private server; the user's tmux config is untouched.
set -g default-terminal tmux-256color
set -g mouse on
set -g status-left 'Pico monitor '
set -g status-left-length 14
set -g status-right 'Ctrl+b Up/Down: focus | q: quit'
set -g status-right-length 60
set -g window-status-format ''
set -g window-status-current-format ''
bind-key -n q if-shell -F '#{==:#{pane_index},0}' kill-session 'send-keys q'
# Quitting either viewer closes both panes and lets the runner stop reception.
set-hook -g pane-exited 'kill-session'
